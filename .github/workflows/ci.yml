name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Installs the tools pinned in mise.toml (just, nextest, cargo-deny, trunk).
      - uses: jdx/mise-action@v3
      - run: rustup show active-toolchain
      - run: just gate
