[package]
name = "bridge"
description = "passporter-bridge: the authenticated HTTP/WebSocket API in front of herdr, and the PWA's web server."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "passporter-bridge"
path = "src/main.rs"

[[bin]]
name = "passporter"
path = "src/cli/main.rs"

# Forwards Claude Code hook payloads to the bridge; also prints the settings
# change that installs it (docs/hooks.md).
[[bin]]
name = "passporter-hook"
path = "hooks/main.rs"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "tokio", "ws"] }
base64 = "0.22.1"
getrandom = "0.4.3"
herdr.workspace = true
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
percent-encoding = "2.3.2"
protocol.workspace = true
qrcode = { version = "0.14.1", default-features = false }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.11.1"
# TL;DRs: the Summarizer trait, cache and hardened `claude -p` (design §6.4).
summarize.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# TLS for the edge -> dev hop: rustls (ring) as for push, on tokio.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["fs", "limit", "timeout"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
transcripts.workspace = true
# X.509 parsing for `passporter doctor` (the SAN check); already under rustls.
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["std"] }

[dev-dependencies]
herdr = { workspace = true, features = ["fake"] }
summarize = { workspace = true, features = ["fake"] }
# A throwaway CA and leaves for the TLS tests, made at runtime.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

[lints]
workspace = true
