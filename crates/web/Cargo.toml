  "EcKeyGenParams",
  "EcdsaParams",
  "Event",
  "EventTarget",
  "Element",
  "File",
  "FileList",
  "Headers",
  "History",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlVideoElement",
  "IdbDatabase",
  "IdbFactory",
