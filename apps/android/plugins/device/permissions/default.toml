"$schema" = "schemas/schema.json"

[default]
description = """
What the paired bridge's PWA may ask of the device identity: whether the app
is paired, pairing with a code, an app-scope session token, forgetting the
pairing, how agent news reaches the phone (no endpoints or keys), and
opening the app's own notification setup. A car-scope token is native-only
and never reaches the webview.
"""
permissions = [
    "allow-status",
    "allow-pair",
    "allow-session",
    "allow-forget",
    "allow-notificationStatus",
    "allow-notificationSetup",
]
